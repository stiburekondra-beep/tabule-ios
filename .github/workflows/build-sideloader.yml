name: build-sideloader

# Postaví Windows verzi sideloaderu Dadoum/Sideloader (GPL-3.0) s opravou
# `Fix #129` z 18. 9. 2026 — ta mění hardcoded identifikátor klienta
# z `com.apple.dt.Xcode/3594.4.19` na `com.apple.akd/1.0`. Apple od
# začátku září 2026 odmítá každý požadavek na gsa.apple.com, který se
# hlásí jako Xcode, a AltServer na Windows tuhle opravu (zatím) nemá —
# proto instalace končí chybou 3840 „unknown tag html on line 1".
# Viz lab/hodinky-niceboy/F19-proc-nejde-instalace.md.
#
# Nic se nezveřejňuje: výsledek zůstane jako artefakt běhu (GPL vyžaduje
# u binárky nabídnout i zdroj — ten je veřejný v původním repu, my jen
# stavíme pro vlastní potřebu).
#
# Kroky jejich composite actions jsou tu rozepsané ručně a najemno —
# logy běhu nejdou z veřejného API stáhnout bez přihlášení, takže jediná
# věc, kterou se o selhání dozvíme, je JMÉNO kroku, který spadl. Proto
# každý krok dělá jednu věc a jmenuje se podle ní.
#
# První pokus (#1) spadl na jejich `setup-d-compiler` na ubuntu-22.04.
# Nejpravděpodobněji na `apt-get install 7zip` — ten balíček se na 22.04
# jmenuje `p7zip-full`, `7zip` je až od 24.04. Tady je runner 24.04
# a instalace má fallback, takže na tomhle to spadnout nemůže.

on:
  push:
    paths: ['.github/workflows/build-sideloader.yml']
  workflow_dispatch: {}

jobs:
  windows-cli:
    name: Sideloader CLI pro Windows
    runs-on: ubuntu-24.04
    steps:
      - name: Stahni Sideloader vcetne submodulu
        uses: actions/checkout@v4
        with:
          repository: Dadoum/Sideloader
          submodules: recursive
          fetch-depth: 0

      - name: Over ze oprava 129 je uvnitr
        run: |
          set -e
          git log --oneline -3
          grep -n "serverFriendlyDescription" source/app/package.d
          if grep -q "com.apple.dt.Xcode" source/app/package.d; then
            echo "CHYBA: stary identifikator com.apple.dt.Xcode je porad uvnitr"
            exit 1
          fi
          echo "OK - identifikator je opraveny"

      - name: Nainstaluj clang a lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Nainstaluj rozbalovac 7z
        run: |
          set -e
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          # jejich skript volá `7z`, na p7zip-full se binárka jmenuje `7z` taky,
          # na balíčku 7zip je to `7zz` — ať existuje obojí
          command -v 7z || sudo ln -s "$(command -v 7zz)" /usr/local/bin/7z
          7z --help > /dev/null && echo "7z je k dispozici"

      - name: Nachystej LDC
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.34.0

      - name: Stahni windowsi knihovny LDC
        run: |
          set -e
          LDC_VERSION=$(ldc2 --version | head -n 1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "LDC $LDC_VERSION"
          echo "LDC_VERSION=$LDC_VERSION" >> "$GITHUB_ENV"
          curl -fLO "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION-windows-x64.7z"
          7z x "./ldc2-$LDC_VERSION-windows-x64.7z" "-o$HOME"
          ls -d "$HOME/ldc2-$LDC_VERSION-windows-x64"

      - name: Nastav LDC na cil windows-msvc
        run: |
          set -e
          mkdir -p "$HOME/.ldc"
          cat > "$HOME/.ldc/ldc2.conf" <<EOF
          "x86_64-.*-windows-msvc":
          {
              switches = [
                  "-defaultlib=phobos2-ldc,druntime-ldc",
              ];
              post-switches = [
                  "-I$HOME/ldc2-$LDC_VERSION-windows-x64/import",
              ];
              lib-dirs = [
                  "$HOME/ldc2-$LDC_VERSION-windows-x64/lib",
              ];
          };
          EOF
          cat "$HOME/.ldc/ldc2.conf"

      - name: Zapis verzi
        run: |
          cat > source/version_string.d <<EOF
          module version_string;
          enum versionStr = "Sideloader build pro Ondru, commit ${{ github.sha }}";
          EOF
          cat source/version_string.d

      - name: Postav CLI
        run: dub build -b release-debug --compiler=ldc2 --arch x86_64-windows-msvc :cli-frontend

      - name: Ukaz co vzniklo
        run: ls -la bin/

      - name: Nahraj jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-windows
          path: bin/*
          if-no-files-found: error
