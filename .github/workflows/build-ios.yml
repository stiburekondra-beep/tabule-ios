name: build-ios

# Build bez Macu: XcodeGen → testy na simulátoru → archiv bez podpisu → nepodepsaná .ipa
# k instalaci přes AltStore. Spouští se při každém pushi na main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nainstaluj XcodeGen
        run: brew install xcodegen

      - name: Vygeneruj Xcode projekt
        run: xcodegen generate

      - name: Vyber simulátor (přednost iPhone 16 Pro, jinak první iPhone)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          d = json.load(sys.stdin)["devices"]
          ios = [x for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pref = [x for x in ios if x["name"] == "iPhone 16 Pro"] or [x for x in ios if "16 Pro" in x["name"]] or ios
          print(pref[0]["udid"] if pref else "")
          print(pref[0]["name"] if pref else "", file=sys.stderr)')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Spusť testy na simulátoru
        continue-on-error: true
        run: |
          xcodebuild             -project Tabule.xcodeproj             -scheme Tabule             -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO             test

      - name: Archivuj appku (bez podpisu)
        run: |
          xcodebuild \
            -project Tabule.xcodeproj \
            -scheme Tabule \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath build/Tabule.xcarchive

      - name: Slož .ipa (ad-hoc podpis, aby ji AltStore přijal)
        run: |
          set -e
          mkdir -p build/Payload
          cp -R build/Tabule.xcarchive/Products/Applications/Tabule.app build/Payload/Tabule.app
          # Xcode s vypnutým podepisováním nevytvoří _CodeSignature; AltStore ji čeká.
          codesign --force --sign - --timestamp=none build/Payload/Tabule.app
          codesign -dv build/Payload/Tabule.app 2>&1 | head -5
          ls -la build/Payload/Tabule.app/_CodeSignature/ || true
          cd build
          zip -r -y -X Tabule-unsigned.ipa Payload
          cd ..
          unzip -l build/Tabule-unsigned.ipa

      - name: Nahraj .ipa jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-unsigned-ipa
          path: build/Tabule-unsigned.ipa
          if-no-files-found: error

      - name: Nahraj .xcarchive jako artefakt (pro ladění)
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-xcarchive
          path: build/Tabule.xcarchive
          if-no-files-found: error

      # Artefakt z Actions jde stáhnout jen po přihlášení — z iPhonu to
      # nejde. Release je veřejný odkaz, na který se dá klepnout v Safari.
      # Schváleno Ondrou 22. 9. 2026.
      - name: Zverejni .ipa jako Release "nejnovejsi"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/Tabule-unsigned.ipa build/Tabule.ipa
          POPIS="Build #${{ github.run_number }} - commit ${{ github.sha }}"
          if gh release view nejnovejsi >/dev/null 2>&1; then
            gh release edit nejnovejsi --notes "$POPIS"
            gh release upload nejnovejsi build/Tabule.ipa --clobber
          else
            gh release create nejnovejsi build/Tabule.ipa --title "Tabule - posledni build" --notes "$POPIS"
          fi
          echo "ke stazeni: https://github.com/${{ github.repository }}/releases/download/nejnovejsi/Tabule.ipa"
