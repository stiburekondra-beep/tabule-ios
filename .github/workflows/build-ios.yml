name: build-ios

# Připraveno k přesunu do kořene budoucího veřejného repa (soubor musí být
# na cestě .github/workflows/build-ios.yml od kořene repa, aby ho GitHub
# Actions spustil). V lab/hodinky-niceboy/ios/ zatím jen leží jako podklad —
# nepushuje se, dokud o tom Ondra vědomě nerozhodne (F17: teprve „až se osvědčí").
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Nainstaluj XcodeGen
        run: brew install xcodegen

      - name: Vygeneruj Xcode projekt
        run: xcodegen generate

      - name: Spusť testy na simulátoru
        run: |
          xcodebuild \
            -project Tabule.xcodeproj \
            -scheme Tabule \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test

      - name: Archivuj appku (bez podpisu)
        run: |
          xcodebuild \
            -project Tabule.xcodeproj \
            -scheme Tabule \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath build/Tabule.xcarchive

      - name: Slož nepodepsanou .ipa
        run: |
          set -e
          mkdir -p build/Payload
          cp -R build/Tabule.xcarchive/Products/Applications/Tabule.app build/Payload/Tabule.app
          cd build
          zip -r -y Tabule-unsigned.ipa Payload
          cd ..

      - name: Nahraj .ipa jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-unsigned-ipa
          path: ios/build/Tabule-unsigned.ipa
          if-no-files-found: error

      - name: Nahraj .xcarchive jako artefakt (pro ladění)
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-xcarchive
          path: ios/build/Tabule.xcarchive
          if-no-files-found: error
