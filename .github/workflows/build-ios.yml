name: build-ios

# Build bez Macu: XcodeGen → testy na simulátoru → archiv bez podpisu → nepodepsaná .ipa
# k instalaci přes AltStore. Spouští se při každém pushi na main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nainstaluj XcodeGen
        run: brew install xcodegen

      - name: Vygeneruj Xcode projekt
        run: xcodegen generate

      - name: Spusť testy na simulátoru
        run: |
          xcodebuild \
            -project Tabule.xcodeproj \
            -scheme Tabule \
            -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; n=[x["name"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(n[-1])')" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test

      - name: Archivuj appku (bez podpisu)
        run: |
          xcodebuild \
            -project Tabule.xcodeproj \
            -scheme Tabule \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath build/Tabule.xcarchive

      - name: Slož nepodepsanou .ipa
        run: |
          set -e
          mkdir -p build/Payload
          cp -R build/Tabule.xcarchive/Products/Applications/Tabule.app build/Payload/Tabule.app
          cd build
          zip -r -y Tabule-unsigned.ipa Payload
          cd ..

      - name: Nahraj .ipa jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-unsigned-ipa
          path: build/Tabule-unsigned.ipa
          if-no-files-found: error

      - name: Nahraj .xcarchive jako artefakt (pro ladění)
        uses: actions/upload-artifact@v4
        with:
          name: Tabule-xcarchive
          path: build/Tabule.xcarchive
          if-no-files-found: error
